# Google Marketplace consumption-tracking label, applied on every Pod template.
# Value: "Consumption tracking label" from Producer Portal > Overview.
# Keep in sync with podLabels in chart/gim/values.yaml.
# global.podLabels is merged into the pod labels of all GIM workloads and
# loki-minio, but not of the Replicated SDK and Loki subcharts below, which
# need their own podLabels key.
global:
  podLabels:
    goog-partner-solution: isol_plb32_001kf00001cricgiat_xwj46fqts77puudzv6coaytpjyvuibzt

# Replicated SDK subchart (global.podLabels does not propagate in SDK 1.19.x;
# SDK >= 1.20 reads it with replicated.useGlobalSettings: true)
replicated:
  podLabels:
    goog-partner-solution: isol_plb32_001kf00001cricgiat_xwj46fqts77puudzv6coaytpjyvuibzt

serviceAccount:
  create: false
  name: gim # Will be overridden by marketplace

hookMethod: 'none'
# Migration jobs ServiceAccount and settings
migration:
  serviceAccount:
    create: false
    name: gim-migration
  postDeploy:
    backOffLimit: 5
    ttlSecondsAfterFinished: 3600 # 1h to remove errors
  upgradePathCheck:
    enabled: false

# Loki subchart ServiceAccount
loki:
  serviceAccount:
    create: false
  # Loki singleBinary StatefulSet ignores global.podLabels
  loki:
    podLabels:
      goog-partner-solution: isol_plb32_001kf00001cricgiat_xwj46fqts77puudzv6coaytpjyvuibzt

# Loki-minio subchart ServiceAccount
loki-minio:
  serviceAccount:
    create: false

rbac:
  enabled: false

onPrem:
  replicatedRbac:
    enabled: false

ingress:
  annotations:
    kubernetes.io/ingress.class: "gce"

front:
  service:
    type: "NodePort"
    port: 80
    nodePort: 30880
    annotations:
      cloud.google.com/neg: '{"ingress": false}'
      cloud.google.com/backend-config: '{"default": "gim-backend-config"}'
